[project]
name = "aaalice-workflow-hub"
version = "0.0.1"
description = "A workflow subscription and version management hub for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Aaalice233" },
]
dependencies = []

[project.urls]
Repository = "https://github.com/Aaalice233/Aaalice-Workflow-Hub"
Documentation = "https://github.com/Aaalice233/Aaalice-Workflow-Hub/tree/main/docs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workflow_hub"]
