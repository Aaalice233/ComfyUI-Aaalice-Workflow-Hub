[project]
name = "ComfyUI-Aaalice-Workflow-Hub"
version = "1.0.0"
description = "A workflow subscription and version management hub for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Aaalice233" },
]
dependencies = [
    "aiohttp>=3.9",
    "keyring>=25",
    "pydantic>=2.8",
]

[project.urls]
Repository = "https://github.com/Aaalice233/ComfyUI-Aaalice-Workflow-Hub"
Documentation = "https://github.com/Aaalice233/ComfyUI-Aaalice-Workflow-Hub/tree/main/docs"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workflow_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
